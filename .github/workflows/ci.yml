name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore McpGuard.slnx

      - name: Verify formatting
        run: bash scripts/verify-format.sh --verify

      - name: Build
        run: dotnet build McpGuard.slnx --no-restore -c Release

      - name: Test
        run: >
          dotnet test McpGuard.slnx --no-build -c Release --verbosity normal
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage

      # Proof the analyzer is wired end-to-end: a fresh build of the poisoned sample must emit each rule.
      - name: Verify analyzer fires on the poisoned sample
        run: |
          dotnet build samples/PoisonedServer/PoisonedServer.csproj -c Release --no-incremental \
            -p:TreatWarningsAsErrors=false 2>&1 | tee build-sample.log
          for id in MCPG001 MCPG002 MCPG003 MCPG004 MCPG005 MCPG012; do
            if ! grep -q "warning $id" build-sample.log; then
              echo "::error::Expected $id to fire on the poisoned sample, but it did not."
              exit 1
            fi
          done
          echo "MCPG001-MCPG005 and the MCPG012 escalation fired on the poisoned sample as expected."

      - name: Pack analyzer for local feed
        run: >
          dotnet pack src/McpGuard.Analyzers/McpGuard.Analyzers.csproj
          -c Release --no-build -o ./artifacts/local-feed
          -p:PackageVersion=0.1.0-ci

      - name: Upload coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v4
        with:
          directory: ./coverage
          fail_ci_if_error: false

  action-gate:
    name: Action gates on findings
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # Dogfood the reusable action on the poisoned sample: it must fail the build.
      - name: Run mcp-guard action (must fail)
        id: guard
        continue-on-error: true
        uses: ./
        with:
          project: samples/PoisonedServer/PoisonedServer.csproj

      - name: Assert the action failed
        run: |
          if [ "${{ steps.guard.outcome }}" != "failure" ]; then
            echo "::error::The mcp-guard action should have failed on the poisoned sample, but it did not."
            exit 1
          fi
          echo "The mcp-guard action correctly failed the build on the poisoned sample."
