name: Publish to NuGet

on:
  release:
    types: [ published ]

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Pack & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 15

    if: startsWith(github.event.release.tag_name, 'v')

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore McpGuard.slnx

      - name: Verify formatting
        run: bash scripts/verify-format.sh --verify

      - name: Build
        run: dotnet build McpGuard.slnx --no-restore -c Release

      - name: Test
        run: dotnet test McpGuard.slnx --no-build -c Release --verbosity normal

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: >
          dotnet pack src/McpGuard.Analyzers/McpGuard.Analyzers.csproj
          -c Release --no-build -o ./artifacts
          -p:PackageVersion=${{ steps.version.outputs.VERSION }}

      - name: Push to NuGet.org
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Push to GitHub Packages
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.GITHUB_TOKEN }} --source https://nuget.pkg.github.com/diomonogatari/index.json --skip-duplicate
